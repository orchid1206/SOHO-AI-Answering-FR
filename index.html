<html lang="fr">
<head>

  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
  <meta name="theme-color" content="#F5F5F7" />

  <title>Standard téléphonique IA pour indépendants et TPE — ne manquez plus les appels importants</title>
  <meta
    content="Un standard téléphonique IA pour indépendants et TPE : quand vous ne pouvez pas décrocher, l’IA prend le relais selon vos consignes, répond à partir des informations de votre établissement et vous transmet l’essentiel après l’appel."

  <link crossorigin href="https://cdn.jsdelivr.net" rel="preconnect"/>
  <link
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    rel="stylesheet"
  />
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root{
      --bg:#F5F5F7;
      --surface:#FFFFFF;
      --surface-soft:#EFEFF1;
      --surface-blue:#EEF2FF;
      --surface-green:#F3F6E9;

      --ink:#111113;
      --text:#1D1D1F;
      --muted:#6E6E73;
      --subtle:#8E8E93;

      --line:#D9D9DE;
      --line-strong:#C7C7CC;

      --cobalt:#4664FF;
      --cobalt-hover:#3855EF;
      --signal:#C9FF57;
      --danger:#E95360;

      --radius-control:10px;
      --radius-button:12px;
      --radius-card:18px;
      --radius-media:22px;

      --page-pad:clamp(16px,4vw,56px);
      --max:1320px;
      --ease:cubic-bezier(.16,1,.3,1);
      --header-h:64px;

      --font-ko:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --font-en:"Manrope","Pretendard Variable",Pretendard,sans-serif;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    html{
      scroll-behavior:smooth;
      background:var(--bg);
      -webkit-text-size-adjust:100%;
    }

    body{
      min-width:0;
      overflow-x:hidden;
      font-family:var(--font-ko);
      background:var(--bg);
      color:var(--text);
      line-height:1.6;
      letter-spacing:-.018em;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    html[lang="fr"] body{letter-spacing:-.01em}

    html[lang="ko"] h1,
    html[lang="ko"] h2,
    html[lang="ko"] h3,
    html[lang="ko"] p,
    html[lang="ko"] button,
    html[lang="ko"] a{
      word-break:keep-all;
    }

    html[lang="fr"] h1,
    html[lang="fr"] h2,
    html[lang="fr"] h3,
    html[lang="fr"] p,
    html[lang="fr"] button,
    html[lang="fr"] a{
      word-break:normal;
      overflow-wrap:anywhere;
      hyphens:auto;
    }

    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    button{cursor:pointer}
    img{display:block;width:100%;max-width:100%}
    button,a{-webkit-tap-highlight-color:transparent}

    :focus-visible{
      outline:3px solid rgba(70,100,255,.26);
      outline-offset:3px;
    }

    .container{
      width:min(100%,var(--max));
      margin-inline:auto;
      padding-inline:var(--page-pad);
    }

    .section{padding:clamp(72px,8vw,124px) 0}
    .section-soft{background:var(--surface-soft)}

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:9px;
      color:var(--muted);
      font:700 12px/1 var(--font-en);
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .eyebrow::before{
      content:"";
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--signal);
      box-shadow:0 0 0 5px rgba(201,255,87,.13);
    }

    .section-head{
      display:grid;
      grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);
      gap:30px;
      align-items:end;
      margin-bottom:30px;
    }

    .section-head h2,
    .survey-intro h2,
    .trust-copy h2,
    .faq-head h2{
      margin-top:14px;
      color:var(--ink);
      font-size:clamp(38px,5vw,68px);
      line-height:1.04;
      letter-spacing:-.05em;
      font-weight:650;
      text-wrap:balance;
    }

    html[lang="fr"] .section-head h2,
    html[lang="fr"] .survey-intro h2,
    html[lang="fr"] .trust-copy h2,
    html[lang="fr"] .faq-head h2{
      letter-spacing:-.035em;
    }

    .section-head>p{
      justify-self:end;
      max-width:440px;
      color:var(--muted);
      font-size:15px;
      line-height:1.65;
    }

    .btn{
      min-height:48px;
      border:1px solid transparent;
      border-radius:var(--radius-button);
      padding:0 18px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-weight:700;
      transition:
        background .2s var(--ease),
        border-color .2s var(--ease),
        transform .2s var(--ease),
        color .2s var(--ease);
    }

    .btn:active{transform:translateY(1px)}
    .btn-primary{background:var(--cobalt);color:#fff}
    .btn-primary:hover{background:var(--cobalt-hover)}
    .btn-secondary{background:#fff;color:var(--text);border-color:var(--line-strong)}
    .btn-secondary:hover{background:#F8F8FA}
    .btn[disabled]{cursor:not-allowed;opacity:.45}

    /* HEADER */
    .header{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(245,245,247,.88);
      border-bottom:1px solid rgba(17,17,19,.08);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .nav{
      min-height:var(--header-h);
      display:flex;
      align-items:center;
      gap:18px;
    }

    .brand{
      display:inline-flex;
      align-items:center;
      white-space:nowrap;
    }

    .brand-logo{
      display:block;
      height:28px;
      width:auto;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:22px;
      margin-left:28px;
      color:var(--muted);
      font-size:13px;
      font-weight:650;
    }

    .nav-actions{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .nav .btn{
      min-height:40px;
      padding-inline:14px;
      font-size:13px;
    }

    /* ============================================================
       HERO — 핵심 HTML과 동일한 단일 이미지 카드
       이미지 파일은 다음 단계에서 교체:
       assets/hero.png
       ============================================================ */
    .hero{
      position:relative;
      padding:clamp(52px,6.2vw,88px) 0 clamp(46px,5.5vw,72px);
      overflow:hidden;
      background:
        radial-gradient(circle at 80% 8%,rgba(70,100,255,.08),transparent 26%),
        radial-gradient(circle at 16% 78%,rgba(201,255,87,.07),transparent 20%),
        linear-gradient(180deg,#FBFBFD,#F5F5F7);
    }

    .hero-single{display:block}

    .hero-shell-embedded{
      position:relative;
      overflow:hidden;
      border:1px solid #D8D8DC;
      border-radius:var(--radius-media);
      background:linear-gradient(145deg,#ECECF0,#E2E2E7);
      min-height:620px;
      box-shadow:0 18px 45px rgba(0,0,0,.055);
    }

    .hero-image-embedded{
      /* 카페 히어로 이미지에서 인물과 UI가 우측에 몰려 있어 카피는 좌측 여백에 배치 */
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:62% 38%;
    }

    .hero-embedded-veil{
      position:absolute;
      inset:0;
      background:linear-gradient(
        90deg,
        rgba(16,20,30,.68) 0%,
        rgba(16,20,30,.46) 16%,
        rgba(16,20,30,.20) 34%,
        rgba(16,20,30,.06) 48%,
        rgba(16,20,30,0) 63%,
        rgba(16,20,30,0) 100%
      );
      pointer-events:none;
    }

    .hero-embedded-overlay{
      position:relative;
      z-index:2;
      min-height:620px;
      display:flex;
      justify-content:flex-start;
      align-items:center;
      padding:clamp(28px,4vw,44px);
    }

    .hero-embedded-copy{
      width:min(100%,430px);
      padding:18px 18px 4px;
      border-radius:20px;
      background:rgba(18,21,27,.18);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .hero-embedded-copy .eyebrow{
      margin-bottom:16px;
      color:rgba(255,255,255,.88);
    }

    .hero-embedded-copy .eyebrow::before{
      box-shadow:0 0 0 5px rgba(201,255,87,.10);
    }

    .hero-embedded-copy h1{
      max-width:100%;
      color:#fff;
      font-size:clamp(40px,4.6vw,62px);
      line-height:1.02;
      letter-spacing:-.05em;
      font-weight:800;
      text-wrap:balance;
      text-shadow:0 10px 30px rgba(0,0,0,.22);
    }

    html[lang="fr"] .hero-embedded-copy h1{
      letter-spacing:-.035em;
    }

    .hero-embedded-copy h1 .soft{
      display:block;
      margin-top:10px;
      color:rgba(255,255,255,.86);
      font-weight:650;
    }

    .hero-status-card{
      margin-top:18px;
      display:grid;
      grid-template-columns:auto 1fr;
      gap:12px;
      align-items:center;
      padding:15px;
      border-radius:15px;
      background:rgba(255,255,255,.93);
      border:1px solid rgba(17,17,19,.09);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      box-shadow:0 14px 36px rgba(0,0,0,.08);
    }

    .hero-status-icon{
      width:40px;
      height:40px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:var(--surface-blue);
      color:var(--cobalt);
      font-size:19px;
      font-weight:800;
    }

    .hero-status-card strong{
      display:block;
      font-size:14px;
      line-height:1.35;
    }

    .hero-status-card p{
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
    }

    .hero-actions{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      margin-top:28px;
    }

    .hero-actions-below{
      justify-content:center;
      margin-top:18px;
    }

    .hero-note{
      width:100%;
      color:var(--subtle);
      font-size:13px;
      font-weight:650;
      text-align:center;
    }

    /* SURVEY — Hero 바로 아래 */
    .survey{
      background:#F2F2F4;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
    }

    .survey-shell{
      display:grid;
      grid-template-columns:minmax(260px,.64fr) minmax(0,1.36fr);
      gap:clamp(34px,6vw,78px);
      align-items:start;
    }

    .survey-intro{
      position:sticky;
      top:calc(var(--header-h) + 28px);
    }

    .survey-intro h2{font-size:clamp(40px,4.7vw,62px)}

    .survey-intro p{
      margin-top:18px;
      color:var(--muted);
      max-width:440px;
    }

    .survey-meta{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:24px;
    }

    .meta-chip{
      padding:8px 10px;
      border:1px solid var(--line-strong);
      border-radius:999px;
      background:rgba(255,255,255,.72);
      color:var(--muted);
      font-size:11px;
      font-weight:700;
    }

    .survey-card{
      min-width:0;
      padding:clamp(20px,3vw,34px);
      border:1px solid var(--line-strong);
      border-radius:var(--radius-card);
      background:#fff;
      box-shadow:0 16px 36px rgba(0,0,0,.045);
      overflow:hidden;
    }

    .survey-progress{
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:28px;
      color:var(--subtle);
      font:700 12px/1 var(--font-en);
    }

    .progress-track{
      flex:1;
      height:5px;
      border-radius:999px;
      background:#EBEBEF;
      overflow:hidden;
    }

    .progress-bar{
      height:100%;
      width:33.333%;
      background:var(--cobalt);
      border-radius:inherit;
      transition:width .3s var(--ease);
    }

    #questionViewport{
      position:relative;
      overflow:hidden;
      transition:height .34s var(--ease);
    }

    .survey-question h3{
      font-size:clamp(27px,3.3vw,42px);
      line-height:1.14;
      letter-spacing:-.04em;
      font-weight:650;
    }

    .survey-help{
      margin-top:10px;
      color:var(--muted);
      font-size:14px;
    }

    .option-grid{
      display:grid;
      gap:9px;
      margin-top:24px;
    }

    .option{
      min-height:62px;
      border:1px solid var(--line-strong);
      border-radius:var(--radius-control);
      background:#FCFCFD;
      color:var(--text);
      padding:14px 15px;
      text-align:left;
      font-weight:650;
      line-height:1.4;
      transition:
        background .2s var(--ease),
        border-color .2s var(--ease),
        box-shadow .2s var(--ease),
        transform .18s var(--ease);
    }

    .option:hover{
      border-color:rgba(70,100,255,.40);
      background:#F7F8FF;
    }

    .option:active{transform:scale(.99)}

    .option.selected{
      border-color:var(--cobalt);
      background:var(--surface-blue);
      box-shadow:inset 0 0 0 1px var(--cobalt);
    }

    .other-business-field{margin-top:12px}

    .other-business-field input{
      width:100%;
      min-height:52px;
      padding:0 15px;
      border:1px solid var(--line-strong);
      border-radius:10px;
      background:#fff;
      color:var(--text);
      font:inherit;
      font-size:14px;
      outline:none;
      transition:border-color .2s,box-shadow .2s;
    }

    .other-business-field input:focus{
      border-color:var(--cobalt);
      box-shadow:0 0 0 3px rgba(70,100,255,.10);
    }

    #questionWrap:has(.option[data-value="real_estate"]) .option-grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }

    #questionWrap:has(.option[data-value="real_estate"]) .option{
      min-height:72px;
      text-align:center;
      padding:12px 10px;
      line-height:1.35;
    }

    .survey-actions{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-top:28px;
    }

    .survey-msg{
      min-height:22px;
      margin-top:12px;
      color:var(--danger);
      font-size:13px;
    }

    .survey-success{display:none}
    .survey-success.show{display:block}

    .survey-success h3{
      font-size:clamp(30px,4vw,44px);
      line-height:1.1;
      letter-spacing:-.04em;
    }

    .survey-summary{
      margin-top:22px;
      padding:16px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#F7F7F9;
      display:grid;
      gap:9px;
    }

    .summary-row{
      display:grid;
      grid-template-columns:110px 1fr;
      gap:12px;
      font-size:13px;
    }

    .summary-row span:first-child{color:var(--subtle)}

    /* PROBLEM */
    .problem-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .problem-card{
      min-height:430px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:24px;
      border:1px solid var(--line);
      border-radius:var(--radius-card);
      background:#fff;
      overflow:hidden;
      position:relative;
      box-shadow:0 12px 28px rgba(0,0,0,.035);
    }

    .problem-card:nth-child(1){background:linear-gradient(160deg,#FFFFFF,#F3F4F8)}
    .problem-card:nth-child(2){background:linear-gradient(160deg,#FFFFFF,#F4F5EF)}

    .problem-kicker{
      display:flex;
      justify-content:space-between;
      gap:16px;
      color:#74747A;
      font-size:12px;
      font-weight:700;
    }

    .problem-visual{
      margin:26px 0 24px;
      min-height:270px;
      border-radius:14px;
      border:1px solid rgba(17,17,19,.07);
      overflow:hidden;
      background:#fff;
    }

    .problem-photo{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .problem-card h3{
      font-size:clamp(28px,3vw,40px);
      line-height:1.08;
      letter-spacing:-.04em;
      font-weight:600;
    }

    .problem-card p{
      margin-top:12px;
      color:var(--muted);
    }

    /* HOW */
    .how-panel{
      padding:clamp(20px,3vw,34px);
      border:1px solid var(--line);
      border-radius:var(--radius-card);
      background:linear-gradient(135deg,#ECEEFA,#F7F7F9 54%,#F0F2EA);
      box-shadow:0 12px 28px rgba(0,0,0,.035);
    }

    .how-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }

    .how-step{
      min-height:230px;
      padding:20px;
      border:1px solid rgba(17,17,19,.07);
      border-radius:14px;
      background:rgba(255,255,255,.94);
      display:flex;
      flex-direction:column;
    }

    .how-num{
      color:var(--subtle);
      font:700 11px/1 var(--font-en);
      letter-spacing:.06em;
    }

    .how-icon{
      width:44px;
      height:44px;
      margin-top:34px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:var(--surface-blue);
      color:var(--cobalt);
      font-weight:800;
    }

    .how-step:nth-child(3) .how-icon{
      background:#FFF0F1;
      color:var(--danger);
    }

    .how-step:nth-child(4) .how-icon{
      background:var(--surface-green);
      color:#677B2C;
    }

    .how-step h3{
      margin-top:auto;
      font-size:20px;
      line-height:1.25;
      letter-spacing:-.03em;
    }

    .how-step p{
      margin-top:7px;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    /* USE CASES */
    .usecase-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .usecase-card{
      min-height:440px;
      border:1px solid var(--line);
      border-radius:var(--radius-card);
      background:#fff;
      padding:22px;
      display:flex;
      flex-direction:column;
      box-shadow:0 12px 28px rgba(0,0,0,.03);
    }

    .usecase-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      color:var(--subtle);
      font:700 11px/1 var(--font-en);
    }

    .status-pill{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      color:var(--muted);
      font-size:11px;
      font-weight:700;
    }

    .status-pill i{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--signal);
    }

    .usecase-visual{
      flex:none;
      min-height:300px;
      height:300px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:18px 0 16px;
      border-radius:14px;
      border:1px solid rgba(17,17,19,.07);
      overflow:hidden;
      background:#fff;
    }

    .usecase-image{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .usecase-card h3{
      font-size:clamp(26px,2.6vw,36px);
      line-height:1.08;
      letter-spacing:-.04em;
      font-weight:600;
    }

    .usecase-card>p{
      margin-top:12px;
      color:var(--muted);
      font-size:14px;
    }

    /* TRUST */
    .trust-grid{
      display:grid;
      grid-template-columns:.9fr 1.1fr;
      gap:clamp(34px,6vw,84px);
      align-items:start;
    }

    .trust-copy p{
      margin-top:20px;
      color:var(--muted);
      max-width:570px;
    }

    .trust-list{
      border-top:1px solid var(--line-strong);
    }

    .trust-item{
      display:grid;
      grid-template-columns:52px 1fr;
      gap:18px;
      padding:22px 0;
      border-bottom:1px solid var(--line-strong);
    }

    .trust-index{
      font:700 12px/1 var(--font-en);
      color:var(--subtle);
      padding-top:6px;
    }

    .trust-item h3{
      font-size:22px;
      line-height:1.25;
      letter-spacing:-.03em;
    }

    .trust-item p{
      margin-top:7px;
      color:var(--muted);
      font-size:14px;
    }

    /* FAQ */
    .faq-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
    }

    .faq-item{
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      padding:0 16px;
      box-shadow:0 8px 20px rgba(0,0,0,.025);
    }

    .faq-question{
      width:100%;
      min-height:64px;
      border:0;
      background:transparent;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      text-align:left;
      font-weight:650;
      color:var(--text);
    }

    .faq-question b{
      color:var(--subtle);
      font-size:22px;
      font-weight:500;
      transition:transform .2s var(--ease);
    }

    .faq-item.open .faq-question b{transform:rotate(45deg)}

    .faq-answer{
      display:none;
      padding:0 0 17px;
      color:var(--muted);
      font-size:14px;
      line-height:1.65;
    }

    .faq-item.open .faq-answer{display:block}

    /* FINAL CTA */
    .final-cta{
      padding:46px 0 clamp(92px,9vw,130px);
    }

    .final-box{
      display:grid;
      grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);
      gap:34px;
      align-items:end;
      padding:clamp(28px,5vw,56px);
      border:1px solid var(--line);
      border-radius:var(--radius-media);
      background:linear-gradient(135deg,#ECEEFA,#F7F7F9 56%,#EFF1E8);
    }

    .final-box h2{
      font-size:clamp(44px,6vw,80px);
      line-height:.99;
      letter-spacing:-.055em;
      font-weight:650;
      text-wrap:balance;
    }

    .final-side p{
      color:var(--muted);
      max-width:470px;
      margin-bottom:22px;
    }

    /* FOOTER */
    .footer{
      border-top:1px solid var(--line);
      padding:22px 0 34px;
      color:var(--subtle);
      font-size:12px;
      background:#EFEFF1;
    }

    .footer-inner{
      display:flex;
      justify-content:space-between;
      gap:18px;
      align-items:center;
    }

    .footer-links{
      display:flex;
      gap:16px;
    }

    .footer-links a{
      color:var(--subtle);
      text-decoration:none;
    }

    .footer-links a:hover{color:var(--text)}

    /* MOBILE STICKY */
    .mobile-sticky{display:none}

    .reveal{
      opacity:0;
      transform:translateY(18px);
      transition:opacity .65s var(--ease),transform .65s var(--ease);
    }

    .reveal.visible{
      opacity:1;
      transform:none;
    }

    @media(max-width:1000px){
      .nav-links{display:none}

      .survey-shell,
      .trust-grid,
      .final-box{
        grid-template-columns:1fr;
      }

      .survey-intro{position:static}
      .how-grid{grid-template-columns:1fr 1fr}
      .usecase-grid{grid-template-columns:1fr}
      .usecase-card{min-height:auto}
    }

    @media(max-width:767px){
      :root{
        --page-pad:clamp(16px,5vw,22px);
        --header-h:56px;
      }

      .section{padding:58px 0 64px}

      .nav{min-height:56px}
      .brand-logo{height:24px}
      .nav .btn{display:none}

      /* MOBILE HERO — 핵심 HTML과 동일 */
      .hero{padding:16px 0 30px}

      .hero-single{width:100%}

      .hero-shell-embedded{
        position:relative;
        width:100%;
        min-height:0;
        aspect-ratio:4 / 5;
        border-radius:18px;
        overflow:hidden;
      }

      .hero-image-embedded{
        object-fit:cover;
        object-position:60% 14%;
      }

      .hero-embedded-veil{
        background:linear-gradient(
          180deg,
          rgba(11,15,22,0) 0%,
          rgba(11,15,22,0) 34%,
          rgba(11,15,22,.28) 58%,
          rgba(11,15,22,.72) 82%,
          rgba(11,15,22,.86) 100%
        );
      }

      .hero-embedded-overlay{
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        min-height:0;
        display:flex;
        flex-direction:column;
        justify-content:flex-end;
        align-items:stretch;
        padding:16px 15px 15px;
      }

      .hero-embedded-copy{
        position:static;
        width:100%;
        max-width:none;
        padding:0;
        background:none;
        border-radius:0;
        backdrop-filter:none;
        -webkit-backdrop-filter:none;
      }

      .hero-embedded-copy .eyebrow{display:none}

      .hero .hero-embedded-copy h1{
        width:100%;
        max-width:100%;
        margin:0;
        color:#fff;
        font-size:clamp(25px,7.2vw,34px);
        line-height:1.06;
        letter-spacing:-.03em;
        font-weight:800;
        text-align:left;
        text-wrap:balance;
        text-shadow:0 2px 14px rgba(0,0,0,.45);
      }

      .hero .hero-embedded-copy h1 .soft{
        display:block;
        margin-top:6px;
        color:rgba(255,255,255,.90);
        font-size:.60em;
        line-height:1.14;
        font-weight:650;
        letter-spacing:-.01em;
      }

      .hero-status-card{
        width:100%;
        margin:12px 0 0;
        display:grid;
        grid-template-columns:30px minmax(0,1fr);
        gap:10px;
        align-items:center;
        padding:10px 12px;
        border-radius:13px;
        background:rgba(255,255,255,.94);
        border:1px solid rgba(17,17,19,.08);
        backdrop-filter:blur(10px);
        -webkit-backdrop-filter:blur(10px);
        box-shadow:0 8px 22px rgba(0,0,0,.18);
      }

      .hero-status-icon{
        width:30px;
        height:30px;
        border-radius:8px;
        font-size:14px;
      }

      .hero-status-card strong{
        font-size:12px;
        line-height:1.18;
        letter-spacing:-.01em;
      }

      .hero-status-card p{
        margin-top:2px;
        font-size:10.5px;
        line-height:1.24;
      }

      .hero-actions-below{
        display:grid;
        grid-template-columns:1fr;
        gap:8px;
        width:100%;
        margin-top:14px;
      }

      .hero-actions-below .btn-primary{
        width:100%;
        min-height:48px;
      }

      .hero-actions-below .btn-secondary{display:none}

      .hero-actions-below .hero-note{
        width:100%;
        margin:0;
        text-align:center;
        font-size:10.5px;
        line-height:1.35;
      }

      .section-head{
        grid-template-columns:1fr;
        gap:14px;
        margin-bottom:22px;
      }

      .section-head h2,
      .survey-intro h2,
      .trust-copy h2,
      .faq-head h2{
        font-size:clamp(33px,9vw,44px);
      }

      .section-head>p{justify-self:start}

      /* SURVEY compact */
      #survey.section{padding:48px 0 54px}
      #survey .survey-shell{gap:18px}

      #survey .survey-intro h2{
        margin-top:10px;
        font-size:clamp(31px,8.5vw,39px);
        line-height:1.05;
      }

      #survey .survey-intro p{
        margin-top:10px;
        font-size:13px;
        line-height:1.48;
      }

      #survey .survey-meta{
        gap:6px;
        margin-top:12px;
      }

      #survey .meta-chip{
        padding:6px 8px;
        font-size:10px;
      }

      #survey .survey-card{
        padding:14px 14px 12px;
        border-radius:14px;
      }

      #survey .survey-progress{
        gap:10px;
        margin-bottom:14px;
        font-size:10px;
      }

      #survey .progress-track{height:4px}

      #survey .survey-question h3{
        font-size:clamp(22px,6.2vw,28px);
        line-height:1.15;
        letter-spacing:-.035em;
      }

      #survey .survey-help{
        margin-top:5px;
        font-size:11.5px;
        line-height:1.4;
      }

      #survey .option-grid{
        gap:7px;
        margin-top:12px;
      }

      #survey .option{
        min-height:44px;
        padding:9px 10px;
        border-radius:9px;
        font-size:13px;
        line-height:1.3;
      }

      #questionWrap:has(.option[data-value="real_estate"]) .option-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      #questionWrap:has(.option[data-value="real_estate"]) .option{
        min-height:58px;
        text-align:left;
        padding:10px;
      }

      #survey .survey-actions{margin-top:14px}

      #survey .survey-actions .btn{
        min-height:42px;
        padding-inline:14px;
        font-size:13px;
      }

      #survey .survey-msg{
        min-height:16px;
        margin-top:6px;
        font-size:11px;
        line-height:1.35;
      }

      .problem-grid{grid-template-columns:1fr}
      .problem-card{min-height:0;padding:18px}
      .problem-visual{min-height:230px;margin:20px 0}

      #how.section{padding:56px 0 60px}
      #how .section-head{margin-bottom:18px}

      #how .section-head h2{
        font-size:clamp(32px,8.7vw,40px);
        line-height:1.05;
      }

      #how .section-head>p{
        font-size:13px;
        line-height:1.5;
      }

      #how .how-panel{
        padding:8px;
        border-radius:16px;
      }

      #how .how-grid{
        display:block;
        overflow:hidden;
        border:1px solid rgba(17,17,19,.07);
        border-radius:13px;
        background:rgba(255,255,255,.94);
      }

      #how .how-step{
        min-height:0;
        padding:12px;
        border:0;
        border-radius:0;
        background:transparent;
        display:grid;
        grid-template-columns:26px 38px minmax(0,1fr);
        grid-template-areas:
          "num icon title"
          "num icon desc";
        column-gap:10px;
        row-gap:2px;
        align-items:center;
      }

      #how .how-step + .how-step{
        border-top:1px solid var(--line);
      }

      #how .how-num{
        grid-area:num;
        align-self:start;
        padding-top:5px;
        font-size:10px;
      }

      #how .how-icon{
        grid-area:icon;
        width:36px;
        height:36px;
        margin:0;
        border-radius:10px;
        font-size:13px;
      }

      #how .how-step h3{
        grid-area:title;
        margin:0;
        font-size:16px;
        line-height:1.28;
        letter-spacing:-.025em;
      }

      #how .how-step p{
        grid-area:desc;
        margin:2px 0 0;
        font-size:12px;
        line-height:1.4;
      }

      #usecases.section{padding:56px 0 60px}
      #usecases .section-head{gap:12px;margin-bottom:18px}

      #usecases .section-head h2{
        font-size:clamp(32px,8.7vw,40px);
        line-height:1.05;
      }

      #usecases .section-head>p{
        font-size:13px;
        line-height:1.48;
      }

      #usecases .usecase-grid{gap:8px}

      #usecases .usecase-card{
        min-height:0;
        padding:14px 15px 15px;
        border-radius:14px;
      }

      #usecases .usecase-top{font-size:10px}

      #usecases .status-pill{
        gap:5px;
        padding:6px 8px;
        font-size:10px;
      }

      #usecases .status-pill i{
        width:6px;
        height:6px;
      }

      #usecases .usecase-visual{
        min-height:260px;
        height:260px;
        margin:12px 0 13px;
      }

      #usecases .usecase-card h3{
        font-size:22px;
        line-height:1.13;
        letter-spacing:-.035em;
      }

      #usecases .usecase-card>p{
        margin-top:7px;
        font-size:12.5px;
        line-height:1.43;
      }

      .summary-row{grid-template-columns:90px 1fr}
      .faq-grid{grid-template-columns:1fr}

      .final-box{padding:22px}
      .final-box h2{font-size:clamp(38px,11vw,52px)}

      .footer{
        padding-bottom:calc(96px + env(safe-area-inset-bottom));
      }

      .footer-inner{display:grid}

      .mobile-sticky{
        position:fixed;
        left:12px;
        right:12px;
        bottom:calc(10px + env(safe-area-inset-bottom));
        z-index:45;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:10px;
        padding:6px 6px 6px 13px;
        border:1px solid rgba(17,17,19,.09);
        border-radius:14px;
        background:rgba(255,255,255,.92);
        backdrop-filter:blur(16px);
        box-shadow:0 14px 38px rgba(0,0,0,.10);
        transform:translateY(140%);
        transition:transform .3s var(--ease);
      }

      .mobile-sticky.show{transform:none}

      .mobile-sticky small{
        color:var(--muted);
        font-size:11px;
        font-weight:650;
        line-height:1.35;
        max-width:165px;
      }

      .mobile-sticky .btn{
        min-height:42px;
        padding-inline:14px;
        font-size:12px;
      }
    }

    @media(max-width:767px) and (orientation:landscape){
      .hero-shell-embedded{aspect-ratio:16 / 9}
      .hero-image-embedded{object-position:60% 24%}
      .hero .hero-embedded-copy h1{font-size:clamp(22px,5vw,30px)}
    }

    @media(max-width:380px){
      .hero-embedded-overlay{padding:14px 13px 13px}
      .hero .hero-embedded-copy h1{font-size:clamp(24px,7.6vw,30px)}
      .hero-status-card strong{font-size:11.5px}
      .hero-status-card p{font-size:10px}

      #how .how-step{
        grid-template-columns:23px 34px minmax(0,1fr);
        padding:11px;
        column-gap:8px;
      }

      #how .how-icon{width:34px;height:34px}
      #how .how-step h3{font-size:15px}
      #survey .survey-card{padding:13px 12px}
      #survey .option{padding:8px 9px;font-size:12.5px}
      #usecases .usecase-card h3{font-size:21px}
    }

    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
      .reveal{
        opacity:1;
        transform:none;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="container nav">
      <a aria-label="Accueil CALL X" class="brand" href="#top">
        <img alt="CALL X" class="brand-logo" src="assets/callx-logo.svg"/>
      </a>

      <nav class="nav-links" aria-label="Navigation principale">
        <a data-i18n="navSurvey" href="#survey"></a>
        <a data-i18n="navHow" href="#how"></a>
        <a data-i18n="navCases" href="#usecases"></a>
      </nav>

      <div class="nav-actions">
        <a class="btn btn-primary" data-i18n="navCta" href="#survey"></a>
      </div>
    </div>
  </header>

  <main id="top">

    <!-- HERO -->
    <section class="hero">
      <div class="container hero-single reveal">
        <div class="hero-shell-embedded" aria-label="Illustration Standard téléphonique IA">
          <img
            class="hero-image-embedded"
            src="assets/hero.png"
            alt="Un professionnel reste concentré sur son activité pendant que l’IA prend le relais au téléphone"
            fetchpriority="high"
            decoding="async"
          />

          <div class="hero-embedded-veil"></div>

          <div class="hero-embedded-overlay">
            <div class="hero-embedded-copy">
              <div class="eyebrow" data-i18n="heroEyebrow"></div>

              <h1>
                <span data-i18n="heroTitle1"></span>
                <span class="soft" data-i18n="heroTitle2"></span>
              </h1>

              <div class="hero-status-card">
                <div class="hero-status-icon">IA</div>
                <div>
                  <strong data-i18n="heroStatusTitle"></strong>
                  <p data-i18n="heroStatusBody"></p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="hero-actions hero-actions-below">
          <a class="btn btn-primary" data-i18n="heroCta" href="#survey"></a>
          <a class="btn btn-secondary" data-i18n="heroSecondary" href="#how"></a>
          <p class="hero-note" data-i18n="heroNote"></p>
        </div>
      </div>
    </section>

    <!-- SURVEY — Hero 바로 아래 -->
    <section class="section survey" id="survey">
      <div class="container survey-shell">
        <div class="survey-intro reveal">
          <div class="eyebrow" data-i18n="surveyEyebrow"></div>
          <h2 data-i18n="surveyTitle"></h2>
          <p data-i18n="surveyDesc"></p>

          <div class="survey-meta">
            <span class="meta-chip" data-i18n="surveyMeta1"></span>
            <span class="meta-chip" data-i18n="surveyMeta2"></span>
            <span class="meta-chip" data-i18n="surveyMeta3"></span>
          </div>
        </div>

        <div class="survey-card reveal">
          <form id="surveyForm" novalidate>
            <input
              type="text"
              id="website"
              name="website"
              tabindex="-1"
              autocomplete="off"
              aria-hidden="true"
              style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none"
            />

            <div class="survey-progress">
              <span id="progressText">1 / 3</span>
              <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
              </div>
            </div>

            <div id="questionViewport">
              <div id="questionWrap"></div>
            </div>

            <div class="survey-actions">
              <button
                class="btn btn-secondary"
                data-i18n="prev"
                disabled
                id="prevBtn"
                type="button">
              </button>

              <button
                class="btn btn-primary"
                data-i18n="next"
                id="nextBtn"
                type="button">
              </button>
            </div>

            <p class="survey-msg" id="surveyMsg" role="alert"></p>
          </form>

          <div class="survey-success" id="surveySuccess">
            <h3 data-i18n="localSuccessTitle"></h3>
            <div class="survey-summary" id="surveySummary"></div>

            <div style="margin-top:20px">
              <button
                class="btn btn-secondary"
                data-i18n="reset"
                id="resetSurvey"
                type="button">
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- PROBLEM -->
    <section class="section" id="problem">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="eyebrow" data-i18n="problemEyebrow"></div>
            <h2 data-i18n="problemTitle"></h2>
          </div>

          <p data-i18n="problemDesc"></p>
        </div>

        <div class="problem-grid">
          <article class="problem-card reveal">
            <div class="problem-kicker">
              <span data-i18n="problem1Kicker"></span>
              <span data-i18n="problem1State"></span>
            </div>

            <div class="problem-visual">
              <img
                alt="Une gérante de café sert une cliente pendant qu’un nouvel appel de réservation arrive"
                class="problem-photo"
                src="assets/problem-01.png"
                loading="lazy"
                decoding="async"
              />
            </div>

            <div>
              <h3 data-i18n="problem1Title"></h3>
              <p data-i18n="problem1Desc"></p>
            </div>
          </article>

          <article class="problem-card reveal">
            <div class="problem-kicker">
              <span data-i18n="problem2Kicker"></span>
              <span data-i18n="problem2State"></span>
            </div>

            <div class="problem-visual">
              <img
                alt="Un plombier-chauffagiste répare une chaudière tout en répondant à des appels répétitifs"
                class="problem-photo"
                src="assets/problem-02.png"
                loading="lazy"
                decoding="async"
              />
            </div>

            <div>
              <h3 data-i18n="problem2Title"></h3>
              <p data-i18n="problem2Desc"></p>
            </div>
          </article>
        </div>
      </div>
    </section>

    <!-- HOW -->
    <section class="section" id="how">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="eyebrow" data-i18n="howEyebrow"></div>
            <h2 data-i18n="howTitle"></h2>
          </div>

          <p data-i18n="howDesc"></p>
        </div>

        <div class="how-panel">
          <div class="how-grid">
            <article class="how-step reveal">
              <span class="how-num">01</span>
              <div class="how-icon">☎</div>
              <h3 data-i18n="how1Title"></h3>
              <p data-i18n="how1Desc"></p>
            </article>

            <article class="how-step reveal">
              <span class="how-num">02</span>
              <div class="how-icon">◎</div>
              <h3 data-i18n="how2Title"></h3>
              <p data-i18n="how2Desc"></p>
            </article>

            <article class="how-step reveal">
              <span class="how-num">03</span>
              <div class="how-icon">!</div>
              <h3 data-i18n="how3Title"></h3>
              <p data-i18n="how3Desc"></p>
            </article>

            <article class="how-step reveal">
              <span class="how-num">04</span>
              <div class="how-icon">+</div>
              <h3 data-i18n="how4Title"></h3>
              <p data-i18n="how4Desc"></p>
            </article>
          </div>
        </div>
      </div>
    </section>

    <!-- USE CASES -->
    <section class="section" id="usecases">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="eyebrow" data-i18n="casesEyebrow"></div>
            <h2 data-i18n="casesTitle"></h2>
          </div>

        faq5A:"Oui. Le concept prévoit d’informer clairement l’appelant, dès le début de l’appel, qu’il échange avec une IA.",

        finalTitle:"Moins d’appels à gérer. Plus de temps pour votre activité.",
        finalDesc:"Votre avis nous aidera à concevoir un service vraiment utile aux professionnels.",
        finalCta:"Donner mon avis",

        sending:"Enregistrement…",
        saveError:"Impossible d’enregistrer votre réponse. Veuillez réessayer dans un instant.",
        otherBusinessPlaceholder:"Saisissez votre secteur d’activité.",
        needOtherBusiness:"Veuillez saisir votre secteur d’activité.",
        stickyText:"Quels appels confieriez-vous à l’IA ?",
        stickyCta:"Sondage 30 s"
      }
    };

    const SURVEY = [
      {
        id:"business_type",
        title:{
          ko:"현재 어떤 업종을 운영하고 계신가요?",
          fr:"Quel type d’activité exercez-vous actuellement ?"
        },
        help:{
          ko:"가장 가까운 업종 하나를 선택해주세요.",
          fr:"Sélectionnez le secteur qui correspond le mieux à votre activité."
        },
        options:[
          {value:"real_estate",label:{ko:"부동산·중개",fr:"Immobilier · Agence / mandataire"}},
          {value:"food_cafe",label:{ko:"음식점·카페",fr:"Restaurant · Café"}},
          {value:"beauty",label:{ko:"미용·뷰티",fr:"Coiffure · Beauté"}},
          {value:"healthcare",label:{ko:"병원·약국",fr:"Cabinet médical · Pharmacie"}},
          {value:"education",label:{ko:"교육·레슨",fr:"Formation · Cours particuliers"}},
          {value:"repair_install_cleaning",label:{ko:"수리·설치·청소",fr:"Réparation · Installation · Nettoyage"}},
          {value:"retail",label:{ko:"소매·판매",fr:"Commerce · Vente au détail"}},
          {value:"professional_service",label:{ko:"전문서비스 (세무·법무·컨설팅 등)",fr:"Services professionnels (comptabilité, juridique, conseil, etc.)"}},
          {value:"other",label:{ko:"기타",fr:"Autre"}}
        ]
      },

      {
        id:"most_useful_call_type",
        title:{
          ko:"AI가 어떤 전화를 대신 받아주면 가장 유용할 것 같나요?",
          fr:"Quel type d’appel aimeriez-vous confier en priorité à l’IA ?"
        },
        help:{
          ko:"가장 유용할 것 같은 한 가지를 선택해주세요.",
          fr:"Sélectionnez le type d’appel qui vous serait le plus utile."
        },
        options:[
          {value:"reservation_schedule",label:{ko:"예약·일정 관련 전화",fr:"Réservations · Rendez-vous"}},
          {value:"hours_location",label:{ko:"영업시간·위치 관련 전화",fr:"Horaires · Adresse"}},
          {value:"product_service",label:{ko:"상품·서비스 문의",fr:"Questions sur les produits ou services"}},
          {value:"new_customer",label:{ko:"신규 고객 상담",fr:"Demandes de nouveaux clients"}},
          {value:"existing_customer",label:{ko:"기존 고객 요청·변경",fr:"Suivi · Modifications pour des clients existants"}},
          {value:"business_partner",label:{ko:"거래처·업무 연락",fr:"Fournisseurs · Partenaires professionnels"}},
          {value:"other",label:{ko:"기타",fr:"Autre"}}
        ]
      },

      {
        id:"messaging_voice_call_ai_interest",
        title:{
          ko:"WhatsApp과 같은 메신저 앱의 음성통화에서도 AI 대신받기 기능을 이용하고 싶으신가요?",
          fr:"Souhaiteriez-vous que l’IA puisse aussi répondre à vos appels WhatsApp ou Messenger ?"
        },
        help:{
          ko:"이 기능을 이용하고 싶은 정도를 선택해주세요.",
          fr:"Indiquez dans quelle mesure cette possibilité vous intéresserait."
        },
        options:[
          {value:"1",label:{ko:"전혀 이용하고 싶지 않다",fr:"Pas du tout"}},
          {value:"2",label:{ko:"별로 이용하고 싶지 않다",fr:"Plutôt non"}},
          {value:"3",label:{ko:"보통이다",fr:"Ni oui ni non"}},
          {value:"4",label:{ko:"이용하고 싶다",fr:"Plutôt oui"}},
          {value:"5",label:{ko:"매우 이용하고 싶다",fr:"Tout à fait"}}
        ]
      }
    ];

    const state = {
      lang:'fr',
      current:0,
      answers:{},
      submitted:false
    };

    const $ = (s,r=document)=>r.querySelector(s);
    const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

    const t = key => (
      I18N[state.lang][key] ||
      I18N.ko[key] ||
      key
    );

    const tf = obj => (
      obj?.[state.lang] ||
      obj?.ko ||
      ''
    );

    function applyLanguage(lang){
      state.lang = lang;
      document.documentElement.lang = lang;

      $$('[data-i18n]').forEach(el=>{
        el.textContent = t(el.dataset.i18n);
      });

      document.title =
        lang === 'fr'
          ? 'Standard téléphonique IA pour indépendants et TPE — ne manquez plus les appels importants'
          : '소상공인 AI 전화 대신받기';

      if(state.submitted) renderSummary();
      else renderSurvey();
    }

    /* Reveal */
    const reveals = $$('.reveal');

    if('IntersectionObserver' in window){
      const ro = new IntersectionObserver((entries,obs)=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            entry.target.classList.add('visible');
            obs.unobserve(entry.target);
          }
        });
      },{
        threshold:.12,
        rootMargin:'0px 0px -32px 0px'
      });

      reveals.forEach(el=>ro.observe(el));
    }else{
      reveals.forEach(el=>el.classList.add('visible'));
    }

    /* FAQ */
    $$('.faq-question').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        btn.closest('.faq-item')?.classList.toggle('open');
      });
    });

    /* Survey */
    const questionWrap = $('#questionWrap');
    const progressText = $('#progressText');
    const progressBar = $('#progressBar');
    const prevBtn = $('#prevBtn');
    const nextBtn = $('#nextBtn');
    const msg = $('#surveyMsg');
    const form = $('#surveyForm');
    const success = $('#surveySuccess');

    function total(){
      return SURVEY.length;
    }

    function renderSurvey(){
      const q = SURVEY[state.current];

      if(!q){
        questionWrap.innerHTML='';
        return;
      }

      const opts = q.options.map(o=>{
        const sel =
          state.answers[q.id]===o.value
            ? ' selected'
            : '';

        return `
          <button
            type="button"
            class="option${sel}"
            data-value="${o.value}">
            ${tf(o.label)}
          </button>
        `;
      }).join('');

      const showBusinessOther =
        q.id==='business_type' &&
        state.answers.business_type==='other';

      const otherField = showBusinessOther
        ? `
          <div class="other-business-field">
            <input
              type="text"
              id="businessTypeOther"
              maxlength="80"
              placeholder="${t('otherBusinessPlaceholder')}"
              aria-label="${t('otherBusinessPlaceholder')}"
            />
          </div>
        `
        : '';

      questionWrap.innerHTML = `
        <section class="survey-question active">
          <h3>${tf(q.title)}</h3>
          ${
            tf(q.help)
              ? `<p class="survey-help">${tf(q.help)}</p>`
              : ''
          }
          <div class="option-grid">
            ${opts}
          </div>
          ${otherField}
        </section>
      `;

      $$('.option', questionWrap).forEach(btn=>{
        btn.addEventListener('click', ()=>{
          state.answers[q.id] = btn.dataset.value;

          if(
            q.id==='business_type' &&
            btn.dataset.value!=='other'
          ){
            delete state.answers.business_type_other;
          }

          msg.textContent='';
          renderSurvey();
        });
      });

      const otherInput = $('#businessTypeOther');

      if(otherInput){
        otherInput.value =
          state.answers.business_type_other || '';

        otherInput.addEventListener('input', ()=>{
          state.answers.business_type_other =
            otherInput.value;

          msg.textContent='';
        });

        setTimeout(()=>otherInput.focus(),0);
      }

      progressText.textContent =
        `${state.current+1} / ${total()}`;

      progressBar.style.width =
        `${((state.current+1)/total())*100}%`;

      prevBtn.disabled =
        state.current===0;

      nextBtn.textContent =
        state.current===total()-1
          ? t('submit')
          : t('next');

      msg.textContent='';
    }

    function validateCurrent(){
      const q = SURVEY[state.current];

      if(!state.answers[q.id]){
        msg.textContent = t('needAnswer');
        return false;
      }

      if(
        q.id==='business_type' &&
        state.answers.business_type==='other'
      ){
        const otherText =
          (state.answers.business_type_other || '').trim();

        if(!otherText){
          msg.textContent = t('needOtherBusiness');

          const input = $('#businessTypeOther');
          if(input) input.focus();

          return false;
        }

        state.answers.business_type_other = otherText;
      }

      return true;
    }

    prevBtn.addEventListener('click', ()=>{
      if(state.current<=0) return;

      state.current--;
      renderSurvey();
    });

    function collectTracking(){
      const params =
        new URLSearchParams(location.search);

      const keys = [
        'utm_source',
        'utm_medium',
        'utm_campaign',
        'utm_content',
        'utm_term',
        'fbclid'
      ];

      const out = {};

      keys.forEach(k=>{
        out[k] =
          (params.get(k) || '').slice(0,300) ||
          null;
      });

      out.referrer =
        (document.referrer || '').slice(0,500) ||
        null;

      out.page_path =
        location.pathname.slice(0,300);

      out.variant =
        (
          params.get('v') ||
          params.get('variant') ||
          ''
        ).slice(0,80) ||
        null;

      return out;
    }

    nextBtn.addEventListener('click', async ()=>{
      if(!validateCurrent()) return;

      if(state.current < total()-1){
        state.current++;
        renderSurvey();
        return;
      }

      const surveyAnswers = {
        business_type:
          state.answers.business_type,

        business_type_other:
          state.answers.business_type==='other'
            ? (state.answers.business_type_other || '')
            : '',

        most_useful_call_type:
          state.answers.most_useful_call_type,

        messaging_voice_call_ai_interest:
          state.answers.messaging_voice_call_ai_interest
      };

      const payload = {
        site:window.SITE_ID,
        language:'fr',
        answers:surveyAnswers,
        website:$('#website')?.value || '',
        ...collectTracking()
      };

      try {
        nextBtn.disabled = true;
        nextBtn.textContent = t('sending');
        msg.textContent = '';

        const response = await fetch('/api/submit',{
          method:'POST',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify(payload)
        });

        if(!response.ok){
          const errorText =
            await response.text().catch(()=>'');

          throw new Error(
            `HTTP ${response.status}${
              errorText
                ? `: ${errorText}`
                : ''
            }`
          );
        }

        state.submitted = true;
        form.style.display = 'none';
        success.classList.add('show');
        renderSummary();

      }catch(error){
        console.error(
          'Survey submit error:',
          error
        );

        msg.textContent =
          t('saveError');

      }finally{
        nextBtn.disabled = false;
        nextBtn.textContent = t('submit');
      }
    });

    function renderSummary(){
      const summary = $('#surveySummary');

      const rows = SURVEY.map(q=>{
        const val = state.answers[q.id];
        const opt =
          q.options.find(o=>o.value===val);

        let display =
          opt
            ? tf(opt.label)
            : '—';

        if(
          q.id==='business_type' &&
          val==='other' &&
          state.answers.business_type_other
        ){
          display =
            `${display} · ${state.answers.business_type_other}`;
        }

        return [
          tf(q.title),
          display
        ];
      });

      summary.innerHTML =
        rows
          .map(([k,v])=>`
            <div class="summary-row">
              <span>${k}</span>
              <strong>${v}</strong>
            </div>
          `)
          .join('');
    }

    $('#resetSurvey').addEventListener('click', ()=>{
      Object.assign(state,{
        current:0,
        answers:{},
        submitted:false
      });

      if($('#website')){
        $('#website').value='';
      }

      success.classList.remove('show');
      form.style.display='';
      renderSurvey();
    });

    /* Mobile sticky */
    const sticky = $('#mobileSticky');
    const surveySection = $('#survey');

    function updateSticky(){
      if(innerWidth>767){
        sticky.classList.remove('show');
        sticky.setAttribute('aria-hidden','true');
        return;
      }

      const y = scrollY;

      const show =
        y > innerHeight*.65 &&
        y < surveySection.offsetTop - 160;

      sticky.classList.toggle('show',show);
      sticky.setAttribute(
        'aria-hidden',
        String(!show)
      );
    }

    addEventListener(
      'scroll',
      updateSticky,
      {passive:true}
    );

    addEventListener(
      'resize',
      updateSticky,
      {passive:true}
    );

    applyLanguage('fr');
    renderSurvey();
    updateSticky();
  })();
  </script>

  <script src="tracking.js"></script>
</body>
</html>
