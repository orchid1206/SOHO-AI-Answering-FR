<style>
:root {

*{box-sizing:border-box;margin:0;padding:0}

body{font-family:var(--font-ko);background:var(--bg);color:var(--text);line-height:1.6;letter-spacing:-.018em}

.eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font:700 12px/1 var(--font-en);letter-spacing:.08em;text-transform:uppercase}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 5px rgba(201,255,87,.13)}
.section-head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:30px;align-items:end;margin-bottom:30px}
.section-head h2,.survey-intro h2,.trust-copy h2,.faq-head h2{margin-top:14px;color:var(--ink);font-size:clamp(38px,5.3vw,72px);line-height:1.02;letter-spacing:-.05em;font-weight:620}
.section-head>p{justify-self:end;max-width:430px;color:var(--muted);font-size:15px;line-height:1.65}
.btn{min-height:48px;border:1px solid transparent;border-radius:var(--button);padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:650;transition:.2s}
.btn-primary{background:var(--cobalt);color:#fff} .btn-primary:hover{background:var(--cobalt-hover)} .btn-secondary{background:#fff;color:var(--text);border-color:var(--line2)}
.header{position:sticky;top:0;z-index:50;background:rgba(245,245,247,.88);border-bottom:1px solid rgba(17,17,19,.08);backdrop-filter:blur(18px)}
.nav{min-height:64px;display:flex;align-items:center;gap:18px} .brand{display:inline-flex;align-items:center;white-space:nowrap} .brand-logo{display:block;height:28px;width:auto}
.nav-links{display:flex;align-items:center;gap:22px;margin-left:28px;color:var(--muted);font-size:13px;font-weight:650} .nav-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang-toggle{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:3px;background:#fff} .lang-toggle button{min-width:38px;height:32px;border:0;border-radius:999px;background:transparent;color:var(--subtle);font:700 11px/1 var(--font-en)} .lang-toggle button[aria-pressed="true"]{background:var(--ink);color:#fff}
.hero{padding:72px 0;background:radial-gradient(circle at 80% 8%,rgba(70,100,255,.08),transparent 26%),radial-gradient(circle at 16% 78%,rgba(201,255,87,.07),transparent 20%),linear-gradient(180deg,#FBFBFD,#F5F5F7)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(340px,.84fr);gap:clamp(34px,6vw,86px);align-items:center}
.hero h1{max-width:940px;color:var(--ink);font-size:clamp(54px,7.2vw,106px);line-height:.94;letter-spacing:-.062em;font-weight:650} .hero h1 .soft{display:block;color:#75757A;font-weight:520}
.hero-sub{max-width:700px;margin-top:24px;color:var(--muted);font-size:clamp(17px,1.55vw,21px)} .hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:28px} .hero-note{width:100%;color:var(--subtle);font-size:13px;font-weight:600}
.hero-media{position:relative;min-height:520px;overflow:hidden;border:1px solid #D8D8DC;border-radius:var(--media);background:#eaeaf0;box-shadow:0 18px 45px rgba(0,0,0,.055)} .hero-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover} .hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.02) 40%,rgba(16,20,30,.35) 100%)}
.hero-zeros{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px} .hero-pill{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border:1px solid var(--line2);border-radius:999px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.02)} .hero-pill span{display:block;color:#4B4B51;font-size:13px;font-weight:700;line-height:1;white-space:nowrap}
.problem-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} .problem-card{padding:24px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:0 12px 28px rgba(0,0,0,.035)} .problem-card:nth-child(1){background:linear-gradient(160deg,#FFFFFF,#F3F4F8)} .problem-card:nth-child(2){background:linear-gradient(160deg,#FFFFFF,#F4F5EF)}
.problem-kicker{display:flex;justify-content:space-between;gap:16px;color:#74747A;font-size:12px;font-weight:700} .problem-visual{margin:26px 0 24px;min-height:270px;border-radius:14px;border:1px solid rgba(17,17,19,.07);overflow:hidden;background:#fff} .problem-photo{height:100%;object-fit:cover} .problem-card h3{font-size:clamp(28px,3vw,40px);line-height:1.08;letter-spacing:-.04em;font-weight:600} .problem-card p{margin-top:12px;color:var(--muted)}
.how-panel{padding:24px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(135deg,#ECEEFA,#F7F7F9 54%,#F0F2EA);box-shadow:0 12px 28px rgba(0,0,0,.035)} .how-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.how-step{min-height:230px;padding:20px;border:1px solid rgba(17,17,19,.07);border-radius:14px;background:rgba(255,255,255,.94);display:flex;flex-direction:column} .how-num{color:var(--subtle);font:700 11px/1 var(--font-en);letter-spacing:.06em} .how-icon{width:44px;height:44px;margin-top:34px;border-radius:12px;display:grid;place-items:center;background:#EEF2FF;color:var(--cobalt);font-weight:800} .how-step:nth-child(3) .how-icon{background:#FFF0F1;color:#E95360} .how-step:nth-child(4) .how-icon{background:#F3F6E9;color:#677B2C} .how-step h3{margin-top:auto;font-size:20px;line-height:1.25;letter-spacing:-.03em} .how-step p{margin-top:7px;color:var(--muted);font-size:13px;line-height:1.5}
.survey{background:#F2F2F4;border-top:1px solid var(--line);border-bottom:1px solid var(--line)} .survey-shell{display:grid;grid-template-columns:minmax(260px,.64fr) minmax(0,1.36fr);gap:clamp(34px,6vw,78px);align-items:start} .survey-intro{position:sticky;top:92px} .survey-intro p{margin-top:18px;color:var(--muted);max-width:430px} .survey-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px} .meta-chip{padding:8px 10px;border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.68);color:var(--muted);font-size:11px;font-weight:700}
.survey-card{padding:24px;border:1px solid var(--line2);border-radius:var(--radius);background:#fff;box-shadow:0 16px 36px rgba(0,0,0,.045)} .survey-progress{display:flex;align-items:center;gap:16px;margin-bottom:28px;color:var(--subtle);font:700 12px/1 var(--font-en)} .progress-track{flex:1;height:5px;border-radius:999px;background:#EBEBEF;overflow:hidden} .progress-bar{height:100%;background:var(--cobalt);border-radius:inherit;transition:width .3s} .survey-question h3{font-size:clamp(27px,3.4vw,42px);line-height:1.14;letter-spacing:-.04em;font-weight:600} .survey-help{margin-top:10px;color:var(--muted);font-size:14px} .option-grid{display:grid;gap:9px;margin-top:24px} .option{min-height:62px;border:1px solid var(--line2);border-radius:10px;background:#FCFCFD;color:var(--text);padding:14px 15px;text-align:left;font-weight:620} .option.selected{border-color:var(--cobalt);background:#EEF2FF;box-shadow:inset 0 0 0 1px var(--cobalt)}
.other-business-field{margin-top:12px}
.other-business-field input{
  width:100%;
  min-height:52px;
  padding:0 15px;
  border:1px solid var(--line2);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  font:inherit;
  font-size:14px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.other-business-field input:focus{
  border-color:var(--cobalt);
  box-shadow:0 0 0 3px rgba(70,100,255,.10);
}

/* 설문 1번: 업종 선택지를 한눈에 볼 수 있도록 2열 배치 */
#questionWrap:has(.option[data-value="real_estate"]) .option-grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
}
#questionWrap:has(.option[data-value="real_estate"]) .option{
  min-height:72px;
  text-align:center;
  padding:12px 10px;
  line-height:1.35;
}
 .survey-actions{display:flex;justify-content:space-between;gap:10px;margin-top:28px} .survey-msg{min-height:22px;margin-top:12px;color:#E95360;font-size:13px} .survey-success{display:none} .survey-success.show{display:block} .survey-summary{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#F7F7F9;display:grid;gap:9px} .summary-row{display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:13px} .summary-row span:first-child{color:var(--subtle)}
.usecase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px} .usecase-card{min-height:420px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:22px;display:flex;flex-direction:column;box-shadow:0 12px 28px rgba(0,0,0,.03)} .usecase-card:nth-child(2){background:#fff} .usecase-card:nth-child(3){background:#fff} .usecase-top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--subtle);font:700 11px/1 var(--font-en)} .status-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:11px;font-weight:700} .status-pill i{width:7px;height:7px;border-radius:50%;background:var(--signal)} .usecase-visual{flex:1;min-height:180px;display:flex;align-items:center;justify-content:center;margin:28px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden} .usecase-image{width:100%;height:100%;object-fit:contain;display:block} .case-flow{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;color:var(--muted);font-size:12px;text-align:center} .case-node{padding:12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.78)} .case-arrow{color:var(--cobalt);font:700 18px/1 var(--font-en)} .usecase-card h3{font-size:clamp(26px,2.6vw,36px);line-height:1.08;letter-spacing:-.04em;font-weight:600} .usecase-card>p{margin-top:12px;color:var(--muted);font-size:14px}
.trust-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(34px,6vw,84px);align-items:start} .trust-copy p{margin-top:20px;color:var(--muted);max-width:560px} .trust-list{border-top:1px solid var(--line2)} .trust-item{display:grid;grid-template-columns:52px 1fr;gap:18px;padding:22px 0;border-bottom:1px solid var(--line2)} .trust-index{font:700 12px/1 var(--font-en);color:var(--subtle);padding-top:6px} .trust-item h3{font-size:22px;line-height:1.25;letter-spacing:-.03em} .trust-item p{margin-top:7px;color:var(--muted);font-size:14px}
.faq-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px} .faq-item{border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 16px;box-shadow:0 8px 20px rgba(0,0,0,.025)} .faq-question{width:100%;min-height:64px;border:0;background:transparent;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;font-weight:650;color:var(--text)} .faq-question b{color:var(--subtle);font-size:22px;font-weight:500;transition:transform .2s} .faq-item.open .faq-question b{transform:rotate(45deg)} .faq-answer{display:none;padding:0 0 17px;color:var(--muted);font-size:14px;line-height:1.65} .faq-item.open .faq-answer{display:block}
.final-cta{padding:46px 0 110px} .final-box{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:34px;align-items:end;padding:36px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#ECEEFA,#F7F7F9 56%,#EFF1E8)} .final-box h2{font-size:clamp(44px,6vw,82px);line-height:.98;letter-spacing:-.055em;font-weight:620} .final-side p{color:var(--muted);max-width:470px;margin-bottom:22px} .footer{border-top:1px solid var(--line);padding:22px 0 34px;color:var(--subtle);font-size:12px;background:#EFEFF1} .footer-links{display:flex;gap:16px}.footer-links a{color:var(--subtle);text-decoration:none}.footer-links a:hover{color:var(--text)} .footer-inner{display:flex;justify-content:space-between;gap:18px;align-items:center}
@media(max-width:1000px){.nav-links{display:none} .hero-grid,.survey-shell,.trust-grid,.final-box{grid-template-columns:1fr} .how-grid{grid-template-columns:1fr 1fr} .usecase-grid{grid-template-columns:1fr} .survey-intro{position:static}}
@media(max-width:767px){
#questionWrap:has(.option[data-value="real_estate"]) .option-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
#questionWrap:has(.option[data-value="real_estate"]) .option{min-height:58px;text-align:left;padding:10px}
.brand-logo{height:24px}
.hero-zeros{gap:8px}
.hero-pill{min-height:40px;padding:0 14px}
.hero-pill span{font-size:12px}
.section{padding:64px 0 72px} .hero-grid{display:flex;flex-direction:column;gap:28px;align-items:stretch} .hero h1{font-size:clamp(42px,12vw,58px)} .hero-media{width:100%;min-height:400px} .section-head{grid-template-columns:1fr;gap:14px;margin-bottom:22px} .section-head h2,.survey-intro h2,.trust-copy h2,.faq-head h2{font-size:clamp(34px,9.3vw,46px)} .section-head>p{justify-self:start} .problem-grid,.faq-grid{grid-template-columns:1fr} .how-grid{grid-template-columns:1fr} .footer-inner{display:grid}}
</style>
</head>

const state = { lang:'fr', current:0, answers:{}, submitted:false };
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const t = key => (I18N[state.lang][key] || I18N.ko[key] || key);
const tf = obj => (obj?.[state.lang] || obj?.ko || '');

function applyLanguage(lang){
  state.lang = lang;
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.lang===lang)));
  if(state.submitted) renderSummary(); else renderSurvey();
}
$$('[data-lang]').forEach(btn=>btn.addEventListener('click', ()=>applyLanguage(btn.dataset.lang)));
$$('.faq-question').forEach(btn=>btn.addEventListener('click', ()=>btn.closest('.faq-item')?.classList.toggle('open')));

const questionWrap = $('#questionWrap');
const progressText = $('#progressText');
const progressBar = $('#progressBar');
const prevBtn = $('#prevBtn');
const nextBtn = $('#nextBtn');
const msg = $('#surveyMsg');
const form = $('#surveyForm');
const success = $('#surveySuccess');

function total(){ return SURVEY.length; }
function renderSurvey(){
  const q = SURVEY[state.current];
  if(!q){ questionWrap.innerHTML=''; return; }
  const opts = q.options.map(o=>{
    const sel = state.answers[q.id]===o.value ? ' selected' : '';
    return `<button type="button" class="option${sel}" data-value="${o.value}">${tf(o.label)}</button>`;
  }).join('');

  const showBusinessOther = q.id==='business_type' && state.answers.business_type==='other';
  const otherField = showBusinessOther
    ? `<div class="other-business-field">
         <input type="text" id="businessTypeOther" maxlength="80" placeholder="${t('otherBusinessPlaceholder')}" aria-label="${t('otherBusinessPlaceholder')}">
       </div>`
    : '';

  questionWrap.innerHTML = `
    <section class="survey-question active">
      <h3>${tf(q.title)}</h3>
      ${tf(q.help) ? `<p class="survey-help">${tf(q.help)}</p>` : ''}
      <div class="option-grid">${opts}</div>
      ${otherField}
    </section>`;

  $$('.option', questionWrap).forEach(btn=>btn.addEventListener('click', ()=>{
    state.answers[q.id] = btn.dataset.value;

    if(q.id==='business_type' && btn.dataset.value!=='other'){
      delete state.answers.business_type_other;
    }

    msg.textContent='';
    renderSurvey();
  }));

  const otherInput = $('#businessTypeOther');
  if(otherInput){
    otherInput.value = state.answers.business_type_other || '';
    otherInput.addEventListener('input', ()=>{
      state.answers.business_type_other = otherInput.value;
      msg.textContent='';
    });
    setTimeout(()=>otherInput.focus(), 0);
  }

  progressText.textContent = `${state.current+1} / ${total()}`;
  progressBar.style.width = `${((state.current+1)/total())*100}%`;
  prevBtn.disabled = state.current===0;
  nextBtn.textContent = state.current===total()-1 ? t('submit') : t('next');
  msg.textContent='';
}
function validateCurrent(){
  const q = SURVEY[state.current];
  if(!state.answers[q.id]){
    msg.textContent = t('needAnswer');
    return false;
  }
  if(q.id==='business_type' && state.answers.business_type==='other'){
    const otherText = (state.answers.business_type_other || '').trim();
    if(!otherText){
      msg.textContent = t('needOtherBusiness');
      const input = $('#businessTypeOther');
      if(input) input.focus();
      return false;
    }
    state.answers.business_type_other = otherText;
  }
  return true;
}
prevBtn.addEventListener('click', ()=>{ if(state.current>0){ state.current--; renderSurvey(); } });
nextBtn.addEventListener('click', async ()=>{
  if(!validateCurrent()) return;

  if(state.current < total()-1){
    state.current++;
    renderSurvey();
    return;
  }

  const surveyAnswers = {
    business_type: state.answers.business_type,
    business_type_other: state.answers.business_type==='other'
      ? (state.answers.business_type_other || '')
      : '',
    most_useful_call_type: state.answers.most_useful_call_type,
    messaging_voice_call_ai_interest: state.answers.messaging_voice_call_ai_interest
  };

  const payload = {
    site: 'soho-ai-answering',
    language: 'ko',

    // submit.js / DB 컬럼명 호환을 위해 둘 다 전달
    answer: JSON.stringify(surveyAnswers),
    answers: surveyAnswers,

    business_type: state.answers.business_type,
    business_type_other: state.answers.business_type==='other'
      ? (state.answers.business_type_other || '')
      : '',
    most_useful_call_type: state.answers.most_useful_call_type
  };

  try {
    nextBtn.disabled = true;
    nextBtn.textContent = t('sending');
    msg.textContent = '';

    const response = await fetch('/api/submit', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    if(!response.ok){
      const errorText = await response.text().catch(()=> '');
      throw new Error(`HTTP ${response.status}${errorText ? `: ${errorText}` : ''}`);
    }

    state.submitted = true;
    form.style.display = 'none';
    success.classList.add('show');
    renderSummary();

  } catch(error) {
    console.error('Survey submit error:', error);
    msg.textContent = t('saveError');

  } finally {
    nextBtn.disabled = false;
    nextBtn.textContent = t('submit');
  }
});
function renderSummary(){
  const summary = $('#surveySummary');
  const rows = SURVEY.map(q=>{
    const val = state.answers[q.id];
    const opt = q.options.find(o=>o.value===val);
    let display = opt ? tf(opt.label) : '—';
    if(q.id==='business_type' && val==='other' && state.answers.business_type_other){
      display = `${display} · ${state.answers.business_type_other}`;
    }
    return [tf(q.title), display];
  });
  summary.innerHTML = rows.map(([k,v])=>`<div class="summary-row"><span>${k}</span><strong>${v}</strong></div>`).join('');
}
$('#resetSurvey').addEventListener('click', ()=>{
  Object.assign(state, { current:0, answers:{}, submitted:false });
  success.classList.remove('show');
  form.style.display='';
  renderSurvey();
});
applyLanguage('fr');
renderSurvey();
</script>
<script src="tracking.js"></script>
</body>
</html>
